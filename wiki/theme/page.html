<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="icon.png">
<meta name="theme-color" content="#2f6b3a">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="index.html"><img src="icon.png" alt="" width="32" height="32"><span>Create: Solarpunk</span><small>Wiki</small></a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input type="search" placeholder="Search the wiki" aria-label="Search the wiki" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div class="results" role="listbox" hidden></div>
  </div>
  <button class="icon-btn theme-btn" type="button" aria-label="Switch between light and dark mode">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.8A8 8 0 0 1 9.2 4.5a8 8 0 1 0 10.3 10.3Z"/></svg>
  </button>
  <a class="icon-btn" href="https://github.com/{{repo}}" aria-label="GitHub repository">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="fill"><path d="M12 2.2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2.2Z"/></svg>
  </a>
</header>
<div class="scrim" hidden></div>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Wiki pages">{{nav}}</nav>
  <main id="main">{{content}}</main>
  <aside class="toc" aria-label="On this page">{{toc}}</aside>
</div>
<footer class="footer">
  <p>Create: Solarpunk is a NeoForge mod for Minecraft 1.21.1. This site is built from the <a href="https://github.com/{{repo}}/wiki">GitHub wiki</a>.</p>
  <p><a href="https://github.com/{{repo}}/issues">Report a bug</a> · <a href="https://github.com/{{repo}}">Source code</a></p>
</footer>
<dialog class="lightbox"><img alt=""><button type="button" aria-label="Close">×</button></dialog>
<script src="site.js" defer></script>
</body>
</html>
